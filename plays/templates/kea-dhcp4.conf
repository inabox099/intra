{
"Dhcp4": {

    "interfaces-config": {
        "interfaces": [ "enp0s8" ]
    },
    "lease-database": {
        "type": "memfile"
    },

    "valid-lifetime": 3600, // leases will be valid for 12h
    "renew-timer": 1800, // clients should renew every 6h
    "rebind-timer": 2400, // clients should start looking for other servers after 9h

    "expired-leases-processing": {
        "reclaim-timer-wait-time": 3600,
        "hold-reclaimed-time": 172800,
        "max-reclaim-leases": 0,
        "max-reclaim-time": 0
    },

    "client-classes": [
        {
            "name": "pxe-boot-clients",
            "test": "member('bootp.vendor-class-identifier', 'PXEClient')",
            "option-data": [
                {
                    "name": "boot-file-name",
                    "data": "pxelinux.0",
                    "client-class": "pxe-boot-clients"
                },
                {
                    "name": "next-server",
                    "data": "192.168.0.1",
                    "client-class": "pxe-boot-clients"
                }
            ]
        }
    ],

    "subnet4": [
        {
            "subnet": "192.168.0.0/24",
            "interface": "enp0s8",
            "pools": [
                {
                    "pool": "192.168.0.100-192.168.0.199"
                }
            ],

            "option-data": [
                {
                    "name": "routers",
                    "data": "192.168.0.1"
                },
                {
                    "name": "domain-name-servers",
                    "data": "192.168.0.50"
                }
            ],

            "reservations": [
                {
                    "hw-address": "1a:1b:1c:1d:1e:1f",
                    "ip-address": "192.168.0.10"
                },
                {
                    "client-id": "01:11:22:33:44:55:66",
                    "ip-address": "192.168.0.11"
                }
            ]
        }
    ],

    "loggers": [
    {
        "name": "kea-dhcp4",
        "output_options": [
            {
                "output": "/var/log/kea-dhcp4.log",
                "maxsize": 2048000,
                "maxver": 4
            }
        ],
        "severity": "INFO",
        "debuglevel": 0
    }
  ]
}
}

